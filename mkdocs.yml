site_name: AttuBot / Doom Bot
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - apps/bot
            - apps/server
            - packages/shared-models
            - packages/attu-logging
            - packages/attu-wiki
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            show_if_no_docstring: false
            filters:
              - "!^_"

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Config system: config-system.md
  - Features:
    - Eggs: features/eggs.md
    - Markers: features/markers.md
    - Reminders: features/reminders.md
    - Starboard: features/starboard.md
    - Tasks: features/tasks.md
    - Timekeeping: features/timekeeping.md
    - CCBoard: features/ccboard.md
  - Style:
    - Embeds: style/embed_usage.md
    - Buttons: style/button_usage.md
    - Views: style/view_usage.md
    - Selects: style/select_usage.md
    - Commands: style/command_usage.md
  - API reference:
    - nova-core:
      - Core: api/nova-core/core.md
      - Bridge: api/nova-core/bridge.md
      - Database: api/nova-core/database.md
      - Commands: api/nova-core/commands.md
      - Tasks: api/nova-core/tasks.md
      - CCBoard: api/nova-core/ccboard.md
      - Eggs: api/nova-core/eggs.md
      - Starboard: api/nova-core/starboard.md
      - Reminders: api/nova-core/reminders.md
      - Trees: api/nova-core/trees.md
      - Wiki: api/nova-core/wiki.md
      - Modlog: api/nova-core/modlog.md
    - Packages:
      - Attu Models: api/attu-models.md
      - Attu Logging: api/attu-logging.md
      - Attu Wiki: api/attu-wiki.md
      - Attu Server: api/attu-server.md

config_version = "2.8.0"

[paths]
# path to the assets directory (templates, static files, favicon)
# can be relative (to working directory) or absolute
assets = "apps/bot/assets"

[database]
# ferretdb (mongodb wire-protocol on postgres+documentdb) connection.
# format: mongodb://USER:PASS@HOST:PORT/DBNAME?authSource=admin
# host is the compose service name "ferret"; user/password match POSTGRES_USER
# and POSTGRES_PASSWORD in .secrets/.env (paste the literal values here - this
# toml is not env-substituted at load time).
# authSource=admin is required: ferretdb stores users in the postgres role
# table and authenticates them through the admin database.
# the /doombot path is informational - the bot uses `name` below to pick the db.
url = "mongodb://ferretdb:CHANGE_ME@ferret:27017/doombot?authSource=admin"
name = "doombot"

[auth]
# bearer tokens for the admin API (attu-server); add one per client
api_keys = []

[auth.bot]
# Discord bot token - from the Discord Developer Portal
token = "TOKEN_GOES_HERE"

[auth.web]
# secret key for session signing (attu-server) - required for production
# generate with: python -c "import secrets; print(secrets.token_hex(32))"
secret_key = "your-secret-key-here"

[auth.wiki]
# MediaWiki bot credentials
key = "KEY_GOES_HERE"
page = "Example:Home"
user = "WikiBot@WikiBot"
endpoint = "https://example.org"

[bot]
name = "AttuBot"
welcome_message = "welcome to the archipelago {mention}"

[[guilds]]
id = 1000000000000000000  # replace with your primary guild id
role = "primary"

[[guilds]]
id = 2000000000000000000  # replace with your secondary guild id
role = "secondary"

[backup]
# full database backup via mongodump - leave path empty to disable
# time: 24-hour time string ("HH:MM")
path = ""
time = "03:00"

[trees]
# shared hmac secret - must match DISCORD_BOT_HMAC_SECRET on both tree server instances
# generate with: python -c "import secrets; print(secrets.token_hex(32))"
hmac_secret = "CHANGE_ME"
# backend base urls (docker service names resolve inside the compose network)
dev_base_url = "http://attu-tree-dev:8000"
prod_base_url = "http://attu-tree:8000"

[bridge]
# hmac secret shared between the discord bot and the attu-server web app
# generate with: python -c "import secrets; print(secrets.token_hex(32))"
secret = "CHANGE_ME"
# port the bridge server listens on
bot_port = 5050
# max age in seconds for accepted request timestamps (replay attack window)
replay_window = 60
# attu-server reads this same [bridge] section with its own fields (defaults
# shown); keep bot_url in sync with bot_port above if you change it
# bot_url = "http://core:5050"
# request_timeout = 10.0

# [features]
# enabled = []
# per-feature config goes in [features.<name>] subtables
# example: enabled = ["nova_core.ccboard", "nova_core.eggs", "nova_core.modlog", "nova_core.starboard", "nova_core.wiki", "reminders", "trees"]


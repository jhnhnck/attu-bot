config_version = "2.8.0"

[paths]
# Path to the assets directory (templates, static files, favicon)
# Can be relative (to working directory) or absolute
assets = "apps/bot/assets"

[database]
# ferretdb (mongodb wire-protocol on postgres+documentdb) connection.
# format: mongodb://USER:PASS@HOST:PORT/DBNAME?authSource=admin
# host is the compose service name "ferret"; user/password match POSTGRES_USER
# and POSTGRES_PASSWORD in .secrets/.env (paste the literal values here - this
# toml is not env-substituted at load time).
# authSource=admin is required: ferretdb stores users in the postgres role
# table and authenticates them through the admin database.
# the /doombot path is informational - the bot uses `name` below to pick the db.
url = "mongodb://ferretdb:CHANGE_ME@ferret:27017/doombot?authSource=admin"
name = "doombot"

[auth]
# bearer tokens for the admin API (attu-server); add one per client
api_keys = []

[auth.bot]
# Discord bot token — from the Discord Developer Portal
token = "TOKEN_GOES_HERE"

[auth.web]
# Secret key for Quart/Flask session signing — REQUIRED for production
# Generate with: python -c "import secrets; print(secrets.token_hex(32))"
secret_key = "your-secret-key-here"

[auth.webauthn]
# WebAuthn / Passkey authentication settings
# rp_id must match the domain users access the web interface on
# For local access via localhost: use "localhost"
# For a real domain: use e.g. "example.com"
rp_id = "localhost"
rp_name = "AttuBot Configurator"
# origin must be the full origin including scheme and port
# For local access: "http://localhost:5000"
# Behind a reverse proxy on HTTPS: "https://example.com"
origin = "http://localhost:5000"

[auth.wiki]
# MediaWiki bot credentials
key = "KEY_GOES_HERE"
page = "Example:Home"
user = "WikiBot@WikiBot"
endpoint = "https://example.org"

[bot]
name = "AttuBot"
welcome_message = "welcome to the archipelago {mention}"

[[guilds]]
id = 1000000000000000000  # replace with your primary guild id
role = "primary"

[[guilds]]
id = 2000000000000000000  # replace with your secondary guild id
role = "secondary"

[backup]
# full database backup via mongodump — leave path empty to disable
# time: 24-hour time string ("HH:MM")
path = ""
time = "03:00"

[chat]
# qdrant vector store url (docker service name or external host)
qdrant_url = "http://qdrant:6333"
# ingestor internal api url and shared secret (bot -> ingestor auth)
ingestor_api_url = "http://ingestor:8001"
ingestor_token = "CHANGE_ME"
# llama.cpp openai-compatible inference endpoints
# primary: desktop gpu (tailscale ip); fallback: server cpu
llm_primary_url = "http://<desktop-tailscale-ip>:8080"
llm_fallback_url = "http://llama-server:8080"
# shared bearer token sent to both primary and fallback llama-server instances; leave empty to disable auth
llm_api_key = "CHANGE_ME"
# anthropic api key for claude haiku (used in phase 2+ for discord summarization)
anthropic_api_key = "sk-ant-..."
# per-user /ask cooldown in seconds; set to 0 to disable (useful for testing)
ask_cooldown_seconds = 30
# sentence-transformers embedding model name
embedding_model = "all-MiniLM-L6-v2"
# path to prompt template directory (relative to working dir or absolute)
prompts_dir = "assets/prompts"

[trees]
# shared hmac secret - must match DISCORD_BOT_HMAC_SECRET on both tree server instances
# generate with: python -c "import secrets; print(secrets.token_hex(32))"
hmac_secret = "CHANGE_ME"
# backend base urls (docker service names resolve inside the compose network)
dev_base_url = "http://attu-tree-dev:8000"
prod_base_url = "http://attu-tree:8000"

[bridge]
# hmac secret shared between the discord bot and the attu-server web app
# generate with: python -c "import secrets; print(secrets.token_hex(32))"
secret = "CHANGE_ME"
# host the bridge fastapi server (runs inside the bot's container) binds to.
# must be 0.0.0.0 - the attu-server container reaches it as http://core:5050,
# and 127.0.0.1 binds to the bot container's own loopback, unreachable from
# any sibling container. the compose network is already not exposed to the
# host since core publishes no port for this.
bind_host = "0.0.0.0"
# port the bridge server listens on
bot_port = 5050
# max age in seconds for accepted request timestamps (replay attack window)
replay_window = 60
# attu-server reads this same [bridge] section with its own fields (defaults
# shown); keep bot_url in sync with bind_host/bot_port above if you change them
# bot_url = "http://core:5050"
# request_timeout = 10.0

# [features]
# enabled = []
# per-feature config goes in [features.<name>] subtables
# example: enabled = ["nova_core.ccboard", "nova_core.eggs", "nova_core.modlog", "nova_core.starboard", "nova_core.wiki", "reminders", "trees"]


[project]
name = "attu-models"
version = "0.0.0"
requires-python = "==3.13.*"
# doom_bot.logging is still used as an ambient import in modules not yet flipped
# (phase 1 of the structlog migration finishes this off); attu-logging is the
# explicit replacement and lands on connection.py first.
dependencies = [
    "attu-logging",
    "pydantic",
    "pymongo>=4.6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
attu-logging = { workspace = true }

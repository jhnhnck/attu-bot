{% extends "base.html" %} {% block content %}
<div class="container-fluid py-4">
  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <h3 class="mb-0">
          <i data-feather="clock" class="me-2"></i>
          Configuration Audit Log
        </h3>
        <button class="btn btn-primary btn-sm" id="refresh-audit-btn">
          <i data-feather="refresh-cw" class="me-1"></i> Refresh
        </button>
      </div>
    </div>

    <div class="card-body">
      <!-- Filters -->
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Config Type</label>
          <select class="form-select" id="filterConfigType">
            <option value="">All Types</option>
            <option value="guild">Guild</option>
            <option value="theme">Theme</option>
            <option value="system">System</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Guild ID</label>
          <input
            type="text"
            class="form-control"
            id="filterGuildId"
            placeholder="Filter by guild ID..."
          />
        </div>
        <div class="col-md-4">
          <label class="form-label">Results per page</label>
          <select class="form-select" id="filterLimit">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>
      </div>

      <!-- Loading spinner -->
      <div id="loadingSpinner" class="text-center my-5" style="display: none">
        <div class="spinner-border" role="status"></div>
        <p class="mt-2">Loading audit logs...</p>
      </div>

      <!-- Error message -->
      <div
        id="errorMessage"
        class="alert alert-danger"
        role="alert"
        style="display: none"
      >
        <p id="errorText" class="mb-0"></p>
      </div>

      <!-- Audit log table -->
      <div class="table-responsive">
        <table
          class="table table-hover table-sm"
          id="auditTable"
          style="display: none"
        >
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Type</th>
              <th>Action</th>
              <th>Guild</th>
              <th>IP Address</th>
              <th>Changes</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="auditTableBody">
            <!-- Populated by JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- Empty state -->
      <div id="emptyState" class="text-center my-5" style="display: none">
        <i
          data-feather="info"
          style="width: 64px; height: 64px"
          class="text-muted"
        ></i>
        <p class="text-muted mt-2">No audit logs found</p>
      </div>

      <!-- Pagination -->
      <nav
        id="pagination"
        class="d-flex justify-content-center"
        style="display: none"
      >
        <ul class="pagination mb-0">
          <li class="page-item" id="prevPage">
            <a class="page-link" href="#" tabindex="-1">Previous</a>
          </li>
          <li class="page-item active">
            <span class="page-link" id="currentPageNum">1</span>
          </li>
          <li class="page-item" id="nextPage">
            <a class="page-link" href="#">Next</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>

<!-- Modal for change details -->
<div class="modal fade" id="logDetailsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Change Details</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body" id="logDetailsContent">
        <!-- Populated by JavaScript -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    let currentPage = 0;

    // Load audit logs
    async function loadAuditLogs() {
      const configType = document.getElementById("filterConfigType").value;
      const guildId = document.getElementById("filterGuildId").value;
      const limit = parseInt(document.getElementById("filterLimit").value);
      const skip = currentPage * limit;

      const params = new URLSearchParams({
        limit: limit.toString(),
        skip: skip.toString(),
      });

      if (configType) params.append("config_type", configType);
      if (guildId) params.append("guild_id", guildId);

      // Show loading, hide table and error
      document.getElementById("loadingSpinner").style.display = "block";
      document.getElementById("auditTable").style.display = "none";
      document.getElementById("emptyState").style.display = "none";
      document.getElementById("errorMessage").style.display = "none";
      document.getElementById("pagination").style.display = "none";

      try {
        const response = await fetch(`/api/audit?${params.toString()}`);

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        displayAuditLogs(data.logs);

        // Show pagination if we have results
        if (data.logs.length > 0) {
          document.getElementById("pagination").style.display = "flex";
          document.getElementById("currentPageNum").textContent =
            currentPage + 1;

          const prevBtn = document.getElementById("prevPage");
          const nextBtn = document.getElementById("nextPage");

          prevBtn.classList.toggle("disabled", currentPage === 0);
          nextBtn.classList.toggle("disabled", data.logs.length < limit);
        }
      } catch (error) {
        console.error("Error loading audit logs:", error);
        document.getElementById("errorMessage").style.display = "block";
        document.getElementById("errorText").textContent =
          "Failed to load audit logs: " + error.message;
      } finally {
        document.getElementById("loadingSpinner").style.display = "none";
      }
    }

    // Display audit logs in table
    function displayAuditLogs(logs) {
      const tbody = document.getElementById("auditTableBody");
      tbody.innerHTML = "";

      if (logs.length === 0) {
        document.getElementById("emptyState").style.display = "block";
        return;
      }

      document.getElementById("auditTable").style.display = "table";

      logs.forEach((log) => {
        const row = document.createElement("tr");
        if (!log.success) row.classList.add("table-danger");

        row.innerHTML = `
                <td>${log.timestamp_formatted || new Date(log.timestamp * 1000).toLocaleString()}</td>
                <td><span class="badge ${getTypeBadgeClass(log.config_type)}">${log.config_type}</span></td>
                <td><span class="badge ${getActionBadgeClass(log.action)}">${log.action}</span></td>
                <td>${log.guild_id || "-"}</td>
                <td>${log.ip_address}</td>
                <td>${log.changes ? log.changes.length : 0}</td>
                <td>
                    ${
                      log.success
                        ? '<span class="text-success"><i data-feather="check-circle"></i></span>'
                        : `<span class="text-danger" title="${log.error_message || "Failed"}"><i data-feather="alert-circle"></i></span>`
                    }
                </td>
                <td>
                    ${
                      log.changes && log.changes.length > 0
                        ? `<button class="btn btn-sm btn-outline-secondary" onclick='showChangeDetails(${JSON.stringify(log)})'>Details</button>`
                        : ""
                    }
            `;
        tbody.appendChild(row);
      });

      if (typeof feather !== "undefined") {
        feather.replace();
      }
    }

    function getTypeBadgeClass(type) {
      switch (type) {
        case "guild":
          return "bg-success";
        case "theme":
          return "bg-warning";
        case "system":
          return "bg-danger";
        default:
          return "bg-secondary";
      }
    }

    function getActionBadgeClass(action) {
      switch (action) {
        case "create":
          return "bg-success";
        case "delete":
          return "bg-danger";
        case "update":
          return "bg-primary";
        default:
          return "bg-secondary";
      }
    }

    // Show change details in modal
    function showChangeDetails(log) {
      const modal = new bootstrap.Modal(
        document.getElementById("logDetailsModal"),
      );
      const content = document.getElementById("logDetailsContent");

      let changesHtml = "";
      if (log.changes && log.changes.length > 0) {
        changesHtml = `
                <table class="table table-sm table-bordered">
                    <thead><tr><th>Field</th><th>Old Value</th><th>New Value</th></tr></thead>
                    <tbody>
                        ${log.changes
                          .map(
                            (c) => `
                            <tr>
                                <td><code>${c.field}</code></td>
                                <td class="text-danger">${formatValue(c.old_value)}</td>
                                <td class="text-success">${formatValue(c.new_value)}</td>
                            </tr>
                        `,
                          )
                          .join("")}
                    </tbody>
                </table>
            `;
      } else {
        changesHtml = "<p>No changes recorded.</p>";
      }

      content.innerHTML = `
            <dl class="row">
                <dt class="col-sm-3">Timestamp</dt><dd class="col-sm-9">${log.timestamp_formatted || new Date(log.timestamp * 1000).toLocaleString()}</dd>
                <dt class="col-sm-3">Config Type</dt><dd class="col-sm-9">${log.config_type}</dd>
                <dt class="col-sm-3">Action</dt><dd class="col-sm-9">${log.action}</dd>
                ${log.guild_id ? `<dt class="col-sm-3">Guild ID</dt><dd class="col-sm-9">${log.guild_id}</dd>` : ""}
                <dt class="col-sm-3">IP Address</dt><dd class="col-sm-9">${log.ip_address}</dd>
                ${log.error_message ? `<dt class="col-sm-3">Error</dt><dd class="col-sm-9 text-danger">${log.error_message}</dd>` : ""}
            </dl>
            <h5>Changes</h5>
            ${changesHtml}
        `;

      modal.show();
    }

    function formatValue(value) {
      if (value === null || value === undefined)
        return '<em class="text-muted">null</em>';
      if (typeof value === "object")
        return "<code>" + JSON.stringify(value, null, 2) + "</code>";
      return String(value);
    }

    // Event listeners
    document
      .getElementById("refresh-audit-btn")
      .addEventListener("click", () => {
        currentPage = 0;
        loadAuditLogs();
      });

    document
      .getElementById("filterConfigType")
      .addEventListener("change", () => {
        currentPage = 0;
        loadAuditLogs();
      });

    document.getElementById("filterGuildId").addEventListener(
      "input",
      debounce(() => {
        currentPage = 0;
        loadAuditLogs();
      }, 500),
    );

    document.getElementById("filterLimit").addEventListener("change", () => {
      currentPage = 0;
      loadAuditLogs();
    });

    document.getElementById("prevPage").addEventListener("click", (e) => {
      e.preventDefault();
      if (currentPage > 0) {
        currentPage--;
        loadAuditLogs();
      }
    });

    document.getElementById("nextPage").addEventListener("click", (e) => {
      e.preventDefault();
      currentPage++;
      loadAuditLogs();
    });

    // Make globally accessible
    window.showChangeDetails = showChangeDetails;

    // Debounce helper
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // Initial load
    loadAuditLogs();
  })();
</script>
{% endblock %}

[tool.ruff]
exclude = ["*.wip.py", "wip/"]
target-version = "py313"
line-length = 320

[tool.ruff.lint]
select = [
  # "E4",
  # "E7",
  # "E9",
  "E",
  "F",
  "Q",
  "W",
  "I",
  "UP",
  "ASYNC",
  "S",
  "A",
  "COM",
  "SIM",
  "PTH",
  "PL",
  "RUF",
]

# select = ["ALL"]
ignore = [
  "E501",    # line-length violations
  "PLC0415", # imports at top of file
  "PLR0913", # too many arguments
  "PLE1205", # logging builtin
  "PLR2004", # magic values
  "RUF012",  # ClassVar decorators
  "S311",    # random not for crypto
  "UP037",   # forward typedefs
  "COM812",  # conflicts with formatter
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
# Use a single line after each import block.
lines-after-imports = 1

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
pythonPlatform = "Linux"
typeCheckingMode = "standard"
reportOptionalOperand = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportInvalidCast = false
reportFunctionMemberAccess = false
reportAttributeAccessIssue = false
exclude = ["*.wip.py", "wip/"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # assert is expected in tests
  "S106", # hardcoded test secrets are fine in tests
  "E402", # TZ must be set before imports in some test files
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
markers = [
    "unit: isolated unit tests; no external services",
    "component: tests against real MongoDB; requires a running mongod",
    "integration: full startup or cross-process tests",
]

[tool.coverage.run]
source = ["attubot"]
branch = true
omit = ["wip/*", "*.wip.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

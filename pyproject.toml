[project]
name = "attu-bot-workspace"
version = "0"
requires-python = "==3.13.*"
dependencies = [
    "nova-core",
    "attu-models",
    "attu-logging",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/bot", "apps/server", "packages/shared-models", "packages/attu-logging", "packages/attu-wiki"]

[tool.uv.sources]
nova-core = { workspace = true }
attu-models = { workspace = true }
attu-logging = { workspace = true }

[dependency-groups]
dev = [
    "coverage[toml]",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "respx",
    "freezegun",
    "ruff",
    "pip-audit",
    "basedpyright>=1.39.0",
    "termcolor",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.ruff]
exclude = ["*.wip.py", "wip/", ".venv/"]
target-version = "py313"
line-length = 320
preview = true

[tool.ruff.lint]
select = [
  "E",
  "F",
  "Q",
  "W",
  "I",
  "UP",
  "ASYNC",
  "S",
  "A",
  "COM",
  "SIM",
  "PTH",
  "PL",
  "RUF",
]

ignore = [
  "E111",
  "E114",
  "E117",
  "E303",
  "PLC1901",
  "PLC2701",
  "PLR0904",
  "PLR0914",
  "PLR0917",
  "PLR1702",
  "PLR6104",
  "PLR6201",
  "PLR6301",
  "PLW1514",
  "RUF029",
  "RUF052",
  "RUF067",
  "RUF069",
  "S404",
  "E501",
  "PLC0415",
  "PLR0913",
  "PLE1205",
  "PLR2004",
  "RUF012",
  "UP037",
  "COM812",
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["nova_core", "attu_models", "attu_logging", "attu_wiki"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
pythonPlatform = "Linux"
typeCheckingMode = "standard"
extraPaths = ["scripts", "apps/bot", "packages/shared-models", "packages/attu-logging", "packages/attu-wiki"]
reportOptionalOperand = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportInvalidCast = false
reportFunctionMemberAccess = false
reportAttributeAccessIssue = false
exclude = ["*.wip.py", "wip/", ".venv/"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",
  "S106",
  "E402",
]
"apps/bot/nova_core/commands/debug.py" = ["S311"]
"apps/bot/nova_core/eggs/hatching.py" = ["S311"]
"apps/bot/nova_core/tasks/logo_update.py" = ["S311"]
"scripts/nova_admin.py" = [
  "PLR0911",  # cmd.Cmd do_* methods use early returns per branch; count scales with subcommand count
  "PLR0912",  # cmd.Cmd do_* methods use if/elif chains; branch count scales with subcommand count
  "PLR0915",  # cmd.Cmd do_* methods are inherently large; statement count scales with subcommand count
]

[tool.pytest.ini_options]
testpaths = ["tests/python/unit", "tests/python/component", "tests/python/integration"]
pythonpath = ["scripts", "apps/bot", "apps/server", "packages/shared-models", "packages/attu-logging", "packages/attu-wiki"]
addopts = "-v"
asyncio_mode = "auto"
# 10 seconds is generous for unit tests and tight enough to catch runaways.
# tests that legitimately need longer must opt in with @pytest.mark.timeout(N)
# and a comment explaining why. thread method dumps tracebacks on timeout,
# which is what we want for diagnosing the runaway.
timeout = 10
timeout_method = "thread"
markers = [
    "unit: isolated unit tests; no external services",
    "component: tests against real MongoDB; requires a running mongod",
    "integration: full startup or cross-process tests",
]

[tool.coverage.run]
source = ["apps/bot/nova_core", "packages/shared-models/attu_models"]
branch = true
omit = ["wip/*", "*.wip.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

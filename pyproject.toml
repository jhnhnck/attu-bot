[project]
name = "attubot"
version = "78.1.1"
requires-python = "==3.13.*"
dependencies = [
    "aiohttp",
    "anthropic",
    "anyio>=4.12.0",
    "httpx",
    "hypercorn>=0.16.0",
    "mwparserfromhell",
    "py-cord[speed]<3",
    "pydantic",
    "pymongo>=4.6.0",
    "qdrant-client",
    "quart-rate-limiter>=0.9.0",
    "quart>=0.19.0",
    "sentence-transformers",
    "termcolor",
    "tomlkit",
    "webauthn>=2.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage[toml]",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "freezegun",
    "ruff",
    "pip-audit",
    "basedpyright>=1.39.0",
]

[tool.ruff]
exclude = ["*.wip.py", "wip/", ".venv/"]
target-version = "py313"
line-length = 320
preview = true

[tool.ruff.lint]
select = [
  # "E4",
  # "E7",
  # "E9",
  # pycodestyle
  "E",
  "F",
  "Q",
  "W",
  "I",
  "UP",
  "ASYNC",
  "S",
  "A",
  "COM",
  "SIM",
  "PTH",
  "PL",
  "RUF",
]

# select = ["ALL"]
ignore = [
  # preview rules we explicitly don't want enabled yet
  "E111",    # indentation not multiple of 4 (conflicts with formatter)
  "E114",    # indentation not multiple of 4 (comment)
  "E117",    # over-indented
  "E303",    # too many blank lines (stricter in preview)
  "PLC1901", # compare-to-empty-string
  "PLC2701", # import private name
  "PLR0904", # too many public methods
  "PLR0914", # too many locals
  "PLR0917", # too many positional arguments
  "PLR1702", # too many nested blocks
  "PLR6104", # non-augmented assignment
  "PLR6201", # literal membership
  "PLR6301", # no self use
  "PLW1514", # unspecified encoding
  "RUF029",  # unused async
  "RUF052",  # used dummy variable
  "RUF067",  # non-empty __init__ module
  "RUF069",  # float equality comparison
  "S404",    # suspicious subprocess import
  # existing ignores
  "E501",    # line-length violations
  "PLC0415", # imports at top of file
  "PLR0913", # too many arguments
  "PLE1205", # logging builtin
  "PLR2004", # magic values
  "RUF012",  # ClassVar decorators
  "S311",    # random not for crypto
  "UP037",   # forward typedefs
  "COM812",  # conflicts with formatter
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
# Let ruff format control blank lines after imports to avoid formatter/isort conflicts.
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
pythonPlatform = "Linux"
typeCheckingMode = "standard"
extraPaths = ["scripts"]
reportOptionalOperand = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportInvalidCast = false
reportFunctionMemberAccess = false
reportAttributeAccessIssue = false
exclude = ["*.wip.py", "wip/", ".venv/"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # assert is expected in tests
  "S106", # hardcoded test secrets are fine in tests
  "E402", # TZ must be set before imports in some test files
]

[tool.pytest.ini_options]
testpaths = ["tests/python/unit", "tests/python/component", "tests/python/integration"]
pythonpath = ["scripts"]
addopts = "-v"
asyncio_mode = "auto"
markers = [
    "unit: isolated unit tests; no external services",
    "component: tests against real MongoDB; requires a running mongod",
    "integration: full startup or cross-process tests",
]

[tool.coverage.run]
source = ["attubot"]
branch = true
omit = ["wip/*", "*.wip.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

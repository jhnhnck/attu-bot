[project]
name = "attu-bot-workspace"
version = "0"
requires-python = "==3.13.*"
dependencies = [
    "nova-core",
    "attu-models",
    "attu-logging",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/bot", "apps/server", "packages/shared-models", "packages/attu-logging", "packages/attu-wiki"]

[tool.uv.sources]
nova-core = { workspace = true }
attu-models = { workspace = true }
attu-logging = { workspace = true }

[dependency-groups]
dev = [
    "coverage[toml]",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "respx",
    "freezegun",
    "ruff",
    "pip-audit",
    "basedpyright>=1.39.0",
    "termcolor",
    "mkdocs-material",
    "mkdocstrings[python]",
    "vulture",
]

[tool.ruff]
exclude = ["*.wip.py", "wip/", ".venv/"]
target-version = "py313"
line-length = 320
preview = true

[tool.ruff.lint]
select = [
  "E",
  "F",
  "Q",
  "W",
  "I",
  "UP",
  "ASYNC",
  "S",
  "A",
  "B",
  "C4",
  "COM",
  "DTZ",
  "FLY",
  "FURB",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RSE",
  "SIM",
  "PTH",
  "T10",
  "T20",
  "TC",
  "TRY",
  "PL",
  "RUF",
  "YTT",
]

ignore = [
  "indentation-with-invalid-multiple",
  "indentation-with-invalid-multiple-comment",
  "over-indented",
  "too-many-blank-lines",
  "single-line-implicit-string-concatenation",
  "compare-to-empty-string",
  "import-private-name",
  "too-many-public-methods",
  "too-many-locals",
  "too-many-positional-arguments",
  "too-many-nested-blocks",
  "non-augmented-assignment",
  "literal-membership",
  "no-self-use",
  "unspecified-encoding",
  "unnecessary-return-none",
  "implicit-return-value",
  "implicit-return",
  "unused-async",
  "used-dummy-variable",
  "non-empty-init-module",
  "float-equality-comparison",
  "suspicious-subprocess-import",
  "line-too-long",
  "import-outside-top-level",
  "too-many-arguments",
  "logging-too-many-args",
  "magic-value-comparison",
  "mutable-class-default",
  "typing-only-first-party-import",
  "typing-only-third-party-import",
  "typing-only-standard-library-import",
  "raise-vanilla-class",
  "raise-vanilla-args",
  "quoted-annotation",
  "missing-trailing-comma",
  "noqa-comments",  # preview rule wants `ruff: ignore`; rule #4 is built on `noqa` and cannot be edited
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["nova_core", "attu_models", "attu_logging", "attu_wiki"]

[tool.basedpyright]
pythonPlatform = "Linux"
typeCheckingMode = "standard"
extraPaths = ["scripts", "apps/bot", "packages/shared-models", "packages/attu-logging", "packages/attu-wiki"]
reportOptionalOperand = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportInvalidCast = false
reportFunctionMemberAccess = false
reportAttributeAccessIssue = false
exclude = ["*.wip.py", "wip/", ".venv/"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
  "print",
]
"tests/**" = [
  "assert",
  "hardcoded-password-func-arg",
  "module-import-not-at-top-of-file",
]
"apps/bot/nova_core/commands/debug.py" = ["suspicious-non-cryptographic-random-usage"]
"apps/bot/nova_core/eggs/hatching.py" = ["suspicious-non-cryptographic-random-usage"]
"apps/bot/nova_core/tasks/logo_update.py" = ["suspicious-non-cryptographic-random-usage"]
"scripts/nova_admin.py" = [
  "too-many-return-statements",  # cmd.Cmd do_* methods use early returns per branch; count scales with subcommand count
  "too-many-branches",  # cmd.Cmd do_* methods use if/elif chains; branch count scales with subcommand count
  "too-many-statements",  # cmd.Cmd do_* methods are inherently large; statement count scales with subcommand count
]

[tool.pytest.ini_options]
testpaths = ["tests/python/unit", "tests/python/component", "tests/python/integration"]
pythonpath = ["scripts", "apps/bot", "apps/server", "packages/shared-models", "packages/attu-logging", "packages/attu-wiki"]
addopts = "-v"
asyncio_mode = "auto"
# 10 seconds is generous for unit tests and tight enough to catch runaways.
# tests that legitimately need longer must opt in with @pytest.mark.timeout(N)
# and a comment explaining why. thread method dumps tracebacks on timeout,
# which is what we want for diagnosing the runaway.
timeout = 10
timeout_method = "thread"
markers = [
    "unit: isolated unit tests; no external services",
    "component: tests against real MongoDB; requires a running mongod",
    "integration: full startup or cross-process tests",
]

[tool.coverage.run]
source = ["apps/bot/nova_core", "packages/shared-models/attu_models"]
branch = true
omit = ["wip/*", "*.wip.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

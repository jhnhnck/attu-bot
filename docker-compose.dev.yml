---
# dev environment: ephemeral mongodb seeded from assets/doombot-seed.archive on each start.
# usage (tests): docker compose -f docker-compose.dev.yml run --build --rm tests
# usage (web):   docker compose -f docker-compose.dev.yml up --build web
name: doom-bot-dev

services:
  mongo:
    image: mongo:8
    restart: no
    command: ["mongod", "--config", "/etc/mongod.conf"]
    tmpfs:
      - /data/db
    volumes:
      - ./config/mongod.conf:/etc/mongod.conf
      - ./scripts/mongo_init.sh:/docker-entrypoint-initdb.d/restore.sh:ro
      - ./assets:/tmp/seeds:ro
    environment:
      MONGO_INITDB_DATABASE: doombot
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seed_ready && mongosh --eval 'try{rs.initiate()}catch(e){}; if(!db.hello().isWritablePrimary){quit(1)}' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      target: doombox
    container_name: attu-dev-web
    command: python -u attu-bot.py web
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
      DEBUG: "1"
    ports:
      - "127.0.0.1:5010:5000"
    restart: no
    user: doom:doom
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tests:
    profiles: [tests]
    build:
      context: .
      target: tester
    restart: no
    container_name: attu-dev-tests
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
      TEST_MODE: "1"
      DEBUG: "1"
    env_file:
      - .env
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml:ro
    user: doom:doom
    command: python /home/doom/scripts/run_tests.py
    depends_on:
      mongo:
        condition: service_healthy

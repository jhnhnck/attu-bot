---
# dev environment: ephemeral ferretdb seeded from assets/doombot-seed on each start.
# usage (tests): docker compose -f docker-compose.dev.yml run --build --rm tests
# usage (web):   docker compose -f docker-compose.dev.yml up --build web
name: doom-bot-dev

services:
  ferret:
    image: ghcr.io/ferretdb/ferretdb:latest
    restart: no
    env_file:
      - ./.env
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    restart: no
    env_file:
      - ./.env
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ferret-init:
    build:
      context: .
      target: tester
    restart: no
    env_file:
      - ./.env
    depends_on:
      ferret:
        condition: service_started
    volumes:
      - ./assets:/tmp/seeds:ro
      - ./scripts/ferret_init.sh:/ferret_init.sh:ro
    command: bash /ferret_init.sh

  web:
    build:
      context: .
      target: doombox
    container_name: attu-dev-web
    command: python -u attu-bot.py web
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
      DEBUG: "1"
    ports:
      - "127.0.1.8:8080:5000"
    restart: no
    user: doom:doom
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml:ro
    depends_on:
      ferret-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tests:
    profiles: [tests]
    build:
      context: .
      target: tester
    restart: no
    container_name: attu-dev-tests
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
      TEST_MODE: "1"
      DEBUG: "1"
    env_file:
      - .env
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml:ro
    user: doom:doom
    depends_on:
      ferret:
        condition: service_started


---
# dev environment: ephemeral ferretdb seeded from apps/bot/assets/doombot-seed on each start.
# usage (tests): docker compose -f docker-compose.dev.yml run --build --rm --quiet-build tests
name: doom-bot-dev

services:
  ferret:
    image: ghcr.io/ferretdb/ferretdb:latest
    restart: no
    env_file:
      - ./.env
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    restart: no
    env_file:
      - ./.env
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ferret-init:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: tester
    restart: no
    env_file:
      - ./.env
    depends_on:
      ferret:
        condition: service_started
    volumes:
      - ./apps/bot/assets:/tmp/seeds:ro
      - ./scripts/ferret_init.sh:/ferret_init.sh:ro
    command: bash /ferret_init.sh

  casino:
    profiles: [casino]
    build:
      context: .
      dockerfile: apps/casino/Dockerfile
    restart: no
    environment:
      CASINO_CONFIG_FILE: /home/casino/.secrets/casino.toml
      DEBUG: "1"
    env_file:
      - ./.env
    volumes:
      - ./.secrets/casino.toml:/home/casino/.secrets/casino.toml:ro
    user: casino:casino
    depends_on:
      ferret:
        condition: service_started

  tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: tester
    restart: no
    container_name: attu-dev-tests
    environment:
      ATTU_CONFIG_FILE: /home/doom/.secrets/attu-bot.toml
      TEST_MODE: "1"
      DEBUG: "1"
    env_file:
      - ./.env
    volumes:
      - ./.secrets/attu-bot.toml:/home/doom/.secrets/attu-bot.toml:ro
    user: doom:doom
    # tests bypass ferret-init: they create their own data and don't need the seed.
    depends_on:
      ferret:
        condition: service_started

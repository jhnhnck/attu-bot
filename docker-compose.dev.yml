---
# dev environment: ephemeral ferretdb seeded from apps/bot/assets/doombot-seed on each start.
# usage (tests): docker compose -f docker-compose.dev.yml run --build --rm --quiet-build tests
name: doom-bot-dev

services:
  ferret:
    image: ghcr.io/ferretdb/ferretdb:latest
    restart: no
    env_file:
      - path: ./.env
        required: false
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${POSTGRES_USER:-doom_dev}:${POSTGRES_PASSWORD:-doom_dev}@postgres:5432/${POSTGRES_DB:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    restart: no
    env_file:
      - path: ./.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doom_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doom_dev}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    restart: no
    environment:
      # the mongo:8 image bakes in GLIBC_TUNABLES=glibc.pthread.rseq=0 (for a tcmalloc
      # perf warning, unrelated to this); on host kernels >=6.19 that setting triggers a
      # kernel-level rseq bug that SIGSEGVs mongod ~30s after startup, even fully idle -
      # confirmed via docker-library/mongo#748, tracked upstream at
      # https://lore.kernel.org/all/20260428221058.149538293@kernel.org/. re-enabling
      # rseq works around it until the kernel fix lands.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ulimits:
      # docker's default nofile (1024) is well below WiredTiger's needs; the component
      # suite's rapid create/drop churn across many ephemeral test collections exhausts
      # it mid-run, WiredTiger panics ("Too many open files"), and mongod aborts/crashes -
      # a separate bug from the rseq crash above, confirmed via docker logs (WT_PANIC,
      # "Too many open files", error_code 24)
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "27017:27017"

  ferret-init:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: tester
    restart: no
    env_file:
      - path: ./.env
        required: false
    depends_on:
      ferret:
        condition: service_started
    volumes:
      - ./apps/bot/assets:/tmp/seeds:ro
      - ./scripts/ferret_init.sh:/ferret_init.sh:ro
    command: bash /ferret_init.sh

  tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: tester
    restart: no
    container_name: attu-dev-tests
    environment:
      TEST_DB_URL: "mongodb://${POSTGRES_USER:-doom_dev}:${POSTGRES_PASSWORD:-doom_dev}@ferret:27017/doombot?authSource=admin"
      TEST_MODE: "1"
      DEBUG: "1"
    user: doom:doom
    # tests bypass ferret-init: they create their own data and don't need the seed.
    depends_on:
      ferret:
        condition: service_started

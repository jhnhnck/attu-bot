---
# desktop gpu llama-server - deploy on the desktop machine (2070 Ti)
# this is the primary inference endpoint for /ask; accessible to the server over tailscale.

name: doom-llm

services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    env_file:
      - ./.env
    volumes:
      - ./models:/models
    command: >
      -m /models/Qwen3.5-9B.Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
      --n-gpu-layers 95
      --api-key ${LLM_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8080:8080"
    restart: unless-stopped

<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>
      {% block title %}{{ title }} - Doom Bot Configurator{% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Feather Icons -->
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='img/favicon.png') }}"
    />

    <!-- Custom CSS -->
    <style>
      :root {
        --navbar-bg: #1a1a2e;
        --navbar-text: #ffffff;
      }

      [data-bs-theme="dark"] {
        --navbar-bg: #0d0d1a;
      }

      .navbar-doom {
        background-color: var(--navbar-bg) !important;
      }

      .navbar-doom .navbar-brand,
      .navbar-doom .nav-link {
        color: var(--navbar-text) !important;
      }

      .navbar-doom .nav-link:hover {
        color: rgba(255, 255, 255, 0.8) !important;
      }

      .theme-toggle-btn {
        background: none;
        border: none;
        color: var(--navbar-text);
        cursor: pointer;
        padding: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .theme-toggle-btn:hover {
        opacity: 0.8;
      }

      #navbar-logo {
        width: 28px;
        height: 28px;
        border-radius: 50%;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1;
      }
    </style>

    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-doom sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
          <img id="navbar-logo" src="/api/theme/icon.svg" width="28" height="28" alt="DoomBot logo" />
          DoomBot
        </a>

        <div class="d-flex align-items-center gap-2">
          <!-- Theme toggle -->
          <button
            class="theme-toggle-btn"
            id="theme-toggle"
            type="button"
            aria-label="Toggle theme"
          >
            <i id="theme-icon-light" data-feather="sun" style="width: 14px; height: 14px"></i>
            <i id="theme-icon-dark" data-feather="moon" class="d-none" style="width: 14px; height: 14px"></i>
          </button>

          <!-- Passkey management -->
          <a
            href="/auth/passkeys"
            class="theme-toggle-btn"
            title="Manage Passkeys"
            aria-label="Manage Passkeys"
          >
            <i data-feather="key" style="width: 14px; height: 14px"></i>
          </a>

          <!-- Sign out -->
          <form method="post" action="/auth/logout" class="d-flex">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
            <button
              type="submit"
              class="theme-toggle-btn"
              title="Sign Out"
              aria-label="Sign Out"
            >
              <i data-feather="log-out" style="width: 14px; height: 14px"></i>
            </button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid py-4">
      {% block content %}
      <!-- Content will go here -->
      {% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Main Application Script (ES6 Module for dashboard) -->
    <script
      type="module"
      src="{{ url_for('static', filename='js/main.js') }}"
    ></script>

    <!-- Legacy App Script (for config pages) -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    {% block extra_scripts %}{% endblock %}
  </body>
</html>

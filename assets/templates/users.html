{% extends "base.html" %} {% block content %}
<div class="container-fluid">
  <div class="mb-4">
    <h1 class="h3">
      <i data-feather="user" class="me-2"></i>
      User Configuration
    </h1>
    <p class="text-muted mb-0">Configure authorized users for bot features</p>
  </div>

  <form id="users-form" data-guild-id="{{ active_guild_id }}">
    <div class="card">
      <div class="card-body">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="marker_users">Year Marker Authors</label>
          <div class="input-group mb-2">
            <input class="form-control" id="marker_user_input" type="text" placeholder="User ID" />
            <button class="btn btn-outline-secondary" type="button" id="add-marker-user-btn">Add</button>
          </div>
          <input type="hidden" id="marker_users" name="markers" />
          <ul id="list-marker_users" class="list-group list-group-flush"></ul>
          <small class="text-muted">User IDs authorized to create year markers</small>
        </div>
      </div>
    </div>
  </form>
</div>
{% endblock %} {% block extra_scripts %}
{% if ssr_data %}<script type="application/json" id="ssr-data">{{ ssr_data | safe }}</script>{% endif %}
<script type="module" nonce="{{ csp_nonce }}">
  import { initUsersPage } from "{{ url_for('static', filename='js/pages/users.js') }}";
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof feather !== 'undefined') feather.replace();
    initUsersPage("{{ active_guild_id }}");
  });
</script>
{% endblock %}

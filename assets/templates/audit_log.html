{% extends "base.html" %} {% block content %}
<div class="container-fluid py-4">
  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <h3 class="mb-0">
          <i data-feather="clock" class="me-2"></i>
          Configuration Audit Log
        </h3>
        <button class="btn btn-primary btn-sm" id="refresh-audit-btn">
          <i data-feather="refresh-cw" class="me-1"></i> Refresh
        </button>
      </div>
    </div>

    <div class="card-body">
      <!-- Filters -->
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Config Type</label>
          <select class="form-select" id="filterConfigType">
            <option value="">All Types</option>
            <option value="guild">Guild</option>
            <option value="theme">Theme</option>
            <option value="system">System</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Guild ID</label>
          <input
            type="text"
            class="form-control"
            id="filterGuildId"
            placeholder="Filter by guild ID..."
          />
        </div>
        <div class="col-md-4">
          <label class="form-label">Results per page</label>
          <select class="form-select" id="filterLimit">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>
      </div>

      <!-- Loading spinner -->
      <div id="loadingSpinner" class="text-center my-5" style="display: none">
        <div class="spinner-border" role="status"></div>
        <p class="mt-2">Loading audit logs...</p>
      </div>

      <!-- Error message -->
      <div
        id="errorMessage"
        class="alert alert-danger"
        role="alert"
        style="display: none"
      >
        <p id="errorText" class="mb-0"></p>
      </div>

      <!-- Audit log table -->
      <div class="table-responsive">
        <table
          class="table table-hover table-sm"
          id="auditTable"
          style="display: none"
        >
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Type</th>
              <th>Action</th>
              <th>Guild</th>
              <th>IP Address</th>
              <th>Changes</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="auditTableBody">
            <!-- Populated by JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- Empty state -->
      <div id="emptyState" class="text-center my-5" style="display: none">
        <i
          data-feather="info"
          style="width: 64px; height: 64px"
          class="text-muted"
        ></i>
        <p class="text-muted mt-2">No audit logs found</p>
      </div>

      <!-- Pagination -->
      <nav
        id="pagination"
        class="d-flex justify-content-center"
        style="display: none"
      >
        <ul class="pagination mb-0">
          <li class="page-item" id="prevPage">
            <a class="page-link" href="#" tabindex="-1">Previous</a>
          </li>
          <li class="page-item active">
            <span class="page-link" id="currentPageNum">1</span>
          </li>
          <li class="page-item" id="nextPage">
            <a class="page-link" href="#">Next</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>

<!-- Modal for change details -->
<div class="modal fade" id="logDetailsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Change Details</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body" id="logDetailsContent">
        <!-- Populated by JavaScript -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/pages/audit-log.js') }}"></script>
{% endblock %}

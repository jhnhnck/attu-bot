<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Doom Bot Configurator</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Feather Icons -->
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

    <style>
      :root {
        --navbar-bg: #1a1a2e;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
      }
      .login-card {
        width: 100%;
        max-width: 420px;
        border-radius: 1rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .passkey-icon {
        width: 72px;
        height: 72px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }
      .passkey-icon svg {
        color: white;
        width: 36px;
        height: 36px;
      }
      .btn-passkey {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: white;
        font-size: 1.05rem;
        padding: 0.75rem 2rem;
        border-radius: 0.5rem;
        transition: opacity 0.2s;
      }
      .btn-passkey:hover {
        opacity: 0.9;
        color: white;
      }
      .btn-passkey:disabled {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="login-card card border-0">
      <div class="card-body p-5 text-center">
        <div class="passkey-icon">
          <i data-feather="key"></i>
        </div>

        <h1 class="h3 mb-1 fw-bold">Doom Bot</h1>
        <p class="text-muted mb-4">Configurator · Sign In</p>

        <div id="status-area"></div>

        <button id="btn-login" class="btn btn-passkey w-100 mb-3" type="button">
          <i
            data-feather="shield"
            class="me-2"
            style="width: 18px; height: 18px"
          ></i>
          Sign in with Passkey
        </button>

        <p class="text-muted small mb-0">
          Use the passkey saved in your password manager or device
          authenticator.
        </p>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script type="module" nonce="{{ csp_nonce }}">
      import { beginAuthentication } from "/static/js/modules/webauthn.js";

      // Get redirect target
      const params = new URLSearchParams(window.location.search);
      const nextUrl = params.get("next") || "/";

      function showError(msg) {
        document.getElementById("status-area").innerHTML = `
          <div class="alert alert-danger py-2 mb-3" role="alert">
            <i data-feather="alert-circle" style="width:16px;height:16px;" class="me-1"></i>
            ${msg}
          </div>`;
        feather.replace();
      }

      function showSuccess(msg) {
        document.getElementById("status-area").innerHTML = `
          <div class="alert alert-success py-2 mb-3" role="alert">
            <i data-feather="check-circle" style="width:16px;height:16px;" class="me-1"></i>
            ${msg}
          </div>`;
        feather.replace();
      }

      document
        .getElementById("btn-login")
        .addEventListener("click", async () => {
          const btn = document.getElementById("btn-login");
          btn.disabled = true;
          btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status"></span>Waiting for passkey…`;
          document.getElementById("status-area").innerHTML = "";

          try {
            await beginAuthentication();
            showSuccess("Authentication successful — redirecting…");
            setTimeout(() => {
              window.location.href = nextUrl;
            }, 500);
          } catch (err) {
            showError(
              err.message || "Authentication failed — please try again",
            );
            btn.disabled = false;
            btn.innerHTML = `<svg data-feather="shield" class="me-2" style="width:18px;height:18px;"></svg>Sign in with Passkey`;
            feather.replace();
          }
        });

      // Init feather
      document.addEventListener("DOMContentLoaded", () => feather.replace());
      feather.replace();
    </script>
  </body>
</html>

---
networks:
  attu_dev:
    external: true
    name: attu_dev
services:
  core:
    build: .
    command: python -u attu-bot.py
    container_name: attu-bot-prod
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
      ATTU_MARKER_DB: /home/doom/assets/markers.db
    logging:
      driver: journald
    networks:
      - attu_dev

networks:
    restart: always
    user: doom:doom
    volumes:
      - ./assets/:/home/doom/assets

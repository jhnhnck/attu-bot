services:
  core:
    build: .
    restart: always
    command: python -u /app/attu-bot.py
    environment:
      ATTU_CONFIG_FILE: /app/attu-bot.toml
      ATTU_MARKER_DB: /app/markers.db
    volumes:
    - ./attu-bot.toml:/app/attu-bot.toml
    - ./markers.db:/app/markers.db
    logging:
      driver: journald


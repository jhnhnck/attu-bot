---
services:
  core:
    build:
      context: .
      target: doombox
    command: python -u attu-bot.py
    container_name: attu-bot-prod
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
    logging:
      driver: journald
    restart: always
    user: doom:doom
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml
    depends_on:
      - mongo

  web:
    build:
      context: .
      target: doombox
    command: python -u attu-bot.py web
    container_name: attu-bot-web
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
    logging:
      driver: journald
    ports:
      - "127.0.0.1:5000:5000"
    restart: always
    user: doom:doom
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: attu-bot-mongo
    restart: always
    # ports:
      # - "172.17.0.1:5017:27017"
    volumes:
      - mongo_data:/data/db
      - ./config/mongod.conf:/etc/mongod.conf
    environment:
      MONGO_INITDB_DATABASE: doombot
    env_file:
    - ./.env

  tests:
    build:
      context: .
      target: tester
    restart: no
    profiles:
      - tests
    container_name: attu-bot-tests
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
      TEST_MODE: "1"
      DEBUG: "1"
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml:ro
    user: doom:doom
    command: zsh -c /home/doom/scripts/run_tests.zsh
    depends_on:
      - mongo

volumes:
  mongo_data:

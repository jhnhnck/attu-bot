[project]
name = "attu-chat"
version = "0.0.0"
requires-python = "==3.13.*"
# attu-chat is dormant. it ships as a workspace member so revival is a one-line
# include from the root compose; no service builds this image yet.
# cross-app imports against doom_bot.* are intentional while chat is offline; when
# revived, BaseTask/get_logger/etc should be re-homed in a packages/ module.
dependencies = [
    "aiohttp",
    "anthropic",
    "anyio>=4.12.0",
    "attu-logging",
    "attu-models",
    "httpx",
    "mwparserfromhell",
    "py-cord[speed]<3",
    "pydantic",
    "pymongo>=4.6.0",
    "qdrant-client",
    "quart>=0.19.0",
    "sentence-transformers",
    "tomlkit",
]

[tool.uv]
package = false

[tool.uv.sources]
attu-logging = { workspace = true }
attu-models = { workspace = true }

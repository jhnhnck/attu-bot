[project]
name = "nova-core"
version = "85.0.1"
requires-python = "==3.13.*"
dependencies = [
    "aiohttp",
    "anyio>=4.12.0",
    "attu-logging",
    "attu-models",
    "attu-wiki",
    "fastapi>=0.115.0",
    "httpx",
    "mwparserfromhell",
    "py-cord[speed]<3",
    "pydantic",
    "pymongo>=4.6.0",
    "structlog>=24.0.0",
    "tomlkit",
    "uvicorn>=0.34.0",
]

[tool.uv]
package = false

[tool.uv.sources]
attu-logging = { workspace = true }
attu-models = { workspace = true }
attu-wiki = { workspace = true }

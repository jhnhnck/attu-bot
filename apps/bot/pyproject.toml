[project]
name = "doom-bot"
version = "80.0"
requires-python = "==3.13.*"
dependencies = [
    "aiohttp",
    "anyio>=4.12.0",
    "attu-logging",
    "attu-models",
    "httpx",
    "mwparserfromhell",
    "py-cord[speed]<3",
    "pydantic",

<!-- Sidebar Navigation -->
<nav id="sidebar" class="sidebar d-none d-lg-flex flex-column offcanvas-lg offcanvas-start" tabindex="-1" aria-labelledby="sidebarLabel">
  <div class="sidebar-inner p-3">

    <!-- Guild Toggle (only shown when two guilds exist) -->
    {% if secondary_guild_id %}
    <div class="guild-toggle-wrapper mb-3">
      <div class="btn-group w-100" role="group" aria-label="Guild selector">
        <button type="button"
          class="btn btn-sm {{ 'btn-primary' if is_primary_guild else 'btn-outline-primary' }}"
          id="guild-toggle-primary"
          data-guild-id="{{ primary_guild_id }}">
          {{ primary_guild_name }}
        </button>
        <button type="button"
          class="btn btn-sm {{ 'btn-primary' if not is_primary_guild else 'btn-outline-primary' }}"
          id="guild-toggle-secondary"
          data-guild-id="{{ secondary_guild_id }}">
          {{ secondary_guild_name }}
        </button>
      </div>
    </div>
    {% endif %}

    <!-- Overview -->
    <h6 class="sidebar-heading text-uppercase text-body-secondary small mb-2 px-2">overview</h6>
    <ul class="nav flex-column mb-3">
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/' %}active{% endif %}" href="/">
          <i data-feather="home" class="sidebar-icon"></i>
          dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/audit' %}active{% endif %}" href="/audit">
          <i data-feather="file-text" class="sidebar-icon"></i>
          audit log
        </a>
      </li>
    </ul>

    <!-- Guild Config -->
    <h6 class="sidebar-heading text-uppercase text-body-secondary small mb-2 px-2">
      guild config
      <span class="badge bg-body-secondary text-body-tertiary ms-1">{{ active_guild_name }}</span>
    </h6>
    <ul class="nav flex-column mb-3">
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/channels' %}active{% endif %}" href="/channels">
          <i data-feather="hash" class="sidebar-icon"></i>
          channels
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/epoch' %}active{% endif %}" href="/epoch">
          <i data-feather="clock" class="sidebar-icon"></i>
          epoch
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/roles' %}active{% endif %}" href="/roles">
          <i data-feather="shield" class="sidebar-icon"></i>
          roles
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/users' %}active{% endif %}" href="/users">
          <i data-feather="user" class="sidebar-icon"></i>
          users
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/starboard' %}active{% endif %}" href="/starboard">
          <i data-feather="star" class="sidebar-icon"></i>
          starboard
        </a>
      </li>
    </ul>

    <!-- Guild Data -->
    <h6 class="sidebar-heading text-uppercase text-body-secondary small mb-2 px-2">guild data</h6>
    <ul class="nav flex-column mb-3">
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/years' %}active{% endif %}" href="/years">
          <i data-feather="calendar" class="sidebar-icon"></i>
          years
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/markers' %}active{% endif %}" href="/markers">
          <i data-feather="map-pin" class="sidebar-icon"></i>
          markers
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/time' %}active{% endif %}" href="/time">
          <i data-feather="activity" class="sidebar-icon"></i>
          time status
        </a>
      </li>
    </ul>

    <!-- Global -->
    <h6 class="sidebar-heading text-uppercase text-body-secondary small mb-2 px-2">global</h6>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/theme' %}active{% endif %}" href="/theme">
          <i data-feather="droplet" class="sidebar-icon"></i>
          theme
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link sidebar-link {% if request.path == '/system' %}active{% endif %}" href="/system">
          <i data-feather="sliders" class="sidebar-icon"></i>
          system
        </a>
      </li>
    </ul>
  </div>
</nav>

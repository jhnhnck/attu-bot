---
# prod environment: persistent ferretdb (mongodb-compatible), live discord connection.
# usage: docker compose up --build -d
name: doom-bot

services:
  core:
    build:
      context: .
      target: doombox
    command: python -u attu-bot.py
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
      # DEBUG: 1
    logging:
      driver: journald
    restart: always
    user: doom:doom
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml
      - /srv/backups/attu-bot:/home/doom/backups
    depends_on:
      ferret:
        condition: service_started
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/bot-ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: .
      target: doombox
    command: python -u attu-bot.py web
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
    logging:
      driver: journald
    ports:
      - "127.0.0.1:5000:5000"
    restart: always
    user: doom:doom
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml
    depends_on:
      ferret:
        condition: service_started
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 100
      start_period: 10s

  ferret:
    image: ghcr.io/ferretdb/ferretdb:1
    restart: always
    env_file:
      - ./.env
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: always
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ingestor:
    build:
      context: .
      target: doombox
    command: python -u attu-bot.py ingestor
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
    env_file:
      - .env
    logging:
      driver: journald
    restart: unless-stopped
    user: doom:doom
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml
    depends_on:
      ferret:
        condition: service_started
      qdrant:
        condition: service_started

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    env_file:
      - ./.env
    volumes:
      - ./assets/models:/models
    command: >
      -m /models/Qwen3.5-2B.Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
      --threads 8
      --api-key ${LLM_API_KEY}
    restart: unless-stopped

  tests:
    profiles: [tests]
    build:
      context: .
      target: tester
    restart: no
    container_name: attu-tests
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
      TEST_MODE: "1"
      DEBUG: "1"
    env_file:
      - .env
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml:ro
    user: doom:doom
    command: python /home/doom/scripts/run_tests.py
    depends_on:
      ferret:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:

---
# prod environment: persistent ferretdb (mongodb-compatible), live discord connection.
# usage: docker compose up --build -d
name: doom-bot

services:
  core:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: doombox
    command: python -u apps/bot/attu-bot.py
    environment:
      ATTU_CONFIG_FILE: /home/doom/apps/bot/assets/attu-bot.toml
    logging:
      driver: journald
    restart: always
    user: doom:doom
    volumes:
      - ./apps/bot/assets/attu-bot.toml:/home/doom/apps/bot/assets/attu-bot.toml
      - /srv/backups/attu-bot:/home/doom/backups
    depends_on:
      ferret:
        condition: service_started
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/bot-ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  legacy-web:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: doombox
    command: python -u apps/bot/attu-bot.py web
    environment:
      ATTU_CONFIG_FILE: /home/doom/apps/bot/assets/attu-bot.toml
    logging:
      driver: journald
    ports:
      - "127.0.1.6:8080:5000"
    restart: always
    user: doom:doom
    volumes:
      - ./apps/bot/assets/attu-bot.toml:/home/doom/apps/bot/assets/attu-bot.toml
    depends_on:
      ferret:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 100
      start_period: 10s

  ferret:
    image: ghcr.io/ferretdb/ferretdb:latest
    restart: always
    env_file:
      - ./.env
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    restart: always
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: tester
    restart: no
    container_name: attu-tests
    environment:
      ATTU_CONFIG_FILE: /home/doom/apps/bot/assets/attu-bot.toml
      TEST_MODE: "1"
      DEBUG: "1"
    env_file:
      - .env
    volumes:
      - ./apps/bot/assets/attu-bot.toml:/home/doom/apps/bot/assets/attu-bot.toml:ro
    user: doom:doom
    depends_on:
      ferret:
        condition: service_started

volumes:
  postgres_data:
    external: true
    name: doom-bot_postgres_data

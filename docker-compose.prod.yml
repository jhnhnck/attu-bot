---
# prod environment: persistent mongodb, live discord connection.
# usage: docker compose up --build -d
name: doom-bot

services:
  core:
    build:
      context: .
      target: doombox
    command: python -u attu-bot.py
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
      # DEBUG: 1
    logging:
      driver: journald
    restart: always
    user: doom:doom
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml
      - /srv/backups/attu-bot:/home/doom/backups
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/bot-ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      target: doombox
    command: python -u attu-bot.py web
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
    logging:
      driver: journald
    ports:
      - "127.0.0.1:5000:5000"
    restart: always
    user: doom:doom
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml
    depends_on:
      mongo:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:8
    hostname: mongo
    restart: always
    command: ["mongod", "--config", "/etc/mongod.conf"]
    # ports:
      # - "172.17.0.1:5017:27017"
    volumes:
      - mongo_data:/data/db
      - ./config/mongod.conf:/etc/mongod.conf
    environment:
      MONGO_INITDB_DATABASE: doombot
    env_file:
    - ./.env
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ping:1})' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ingestor:
    build:
      context: .
      target: doombox
    command: python -u attu-bot.py ingestor
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
    env_file:
      - .env
    logging:
      driver: journald
    restart: unless-stopped
    user: doom:doom
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    env_file:
      - ./.env
    volumes:
      - ./assets/models:/models
    command: >
      -m /models/Qwen3.5-2B.Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
      --threads 8
      --api-key ${LLM_API_KEY}
    restart: unless-stopped

  tests:
    profiles: [tests]
    build:
      context: .
      target: tester
    restart: no
    container_name: attu-tests
    environment:
      ATTU_CONFIG_FILE: /home/doom/assets/attu-bot.toml
      TEST_MODE: "1"
      DEBUG: "1"
    env_file:
      - .env
    volumes:
      - ./assets/attu-bot.toml:/home/doom/assets/attu-bot.toml:ro
    user: doom:doom
    command: python /home/doom/scripts/run_tests.py
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  qdrant_data:
